/* ---------- effects -------------------------------------------------------------------- */

}

var shakeAmp = 0;

/* ---------- gameplay ------------------------------------------------------------------- */
function drop() {

  var tc = axis === 'x' ? t.cx : t.cz;
  var size = axis === 'x' ? t.w : t.d;
  var delta = block.pos - tc;
  var thr = 0.12 + size * 0.075 + (drops < 3 ? size * 0.16 : 0) + streak * 0.012 + (attempt > 1 ? 0.12 : 0);
  if (state === 'DEMO') thr = 9;
  var y0 = stack.length * BH;
  var col = block.col;
  drops++;

  if (Math.abs(delta) <= thr) {
    // perfect: snaps onto the tower
    var L = { cx: axis === 'x' ? tc : t.cx, cz: axis === 'z' ? tc : t.cz, w: block.w, d: block.d, col: col, pop: 0 };
    stack.push(L); streak++; perfects++;
    score += 10 * (1 + blasts); popScore = 1;
    sfxPerfect(streak - 1); shakeNow(4); zp = Math.max(zp, 1);
    banner(streak >= 2 ? 'PERFECT x' + streak : 'PERFECT!', '', [140, 255, 225], 0.8);
    shockwave(px(L.cx, y0 + BH, L.cz), py(L.cx, y0 + BH, L.cz), [140, 255, 225], 2.4, 0.45);
    burst(px(L.cx, y0 + BH, L.cz), py(L.cx, y0 + BH, L.cz), 10, [[255, 255, 255], [140, 255, 225]], 160);
    nextW = L.w; nextD = L.d;
    if (streak >= need) { blast(); return; }
  } else {
    var overlap = size - Math.abs(delta);
    if (overlap <= 0.06) { fail(y0); return; }

    var nc = (lo + hi) / 2;
    var L2 = { cx: axis === 'x' ? nc : t.cx, cz: axis === 'z' ? nc : t.cz,
               w: axis === 'x' ? overlap : block.w, d: axis === 'z' ? overlap : block.d, col: col, pop: 0 };
    stack.push(L2);

    var oc = (oLo + oHi) / 2, os = Math.abs(oHi - oLo);

}

function blast() {
  blasts++;
  var layers = blasts === 1 ? 3 : blasts === 2 ? 5 : 7;
  var removable = Math.min(layers, stack.length - 1);
  var t = top(), topY = stack.length * BH;
  var bxp = px(t.cx, topY, t.cz), byp = py(t.cx, topY, t.cz);

  }

  flash = 0.85; shakeNow(18); sfxBlast(); zp = 2.4; coinRain(blasts === 1 ? 26 : 46);
  shockwave(bxp, byp, [255, 220, 130]);
  burst(bxp, byp, 60, [[255, 202, 74], [255, 255, 255], [120, 230, 255], [255, 120, 200]], 520);
  streak = 0; need = 2;

/* ---------- the opening demo: the game plays itself once, so the payoff is seen first ------- */

    prevDelta = cur;

}
function startPlay() {

}

/* ---------- update --------------------------------------------------------------------- */
function update(dt) {
  time += dt;
  camY = lerp(camY, stack.length * BH, 1 - Math.pow(0.001, dt));
  skyBlend = Math.min(1, skyBlend + dt / 1.1);
  flash = Math.max(0, flash - dt * 1.7);
  shakeAmp = Math.max(0, shakeAmp - dt * 40);
  shakeX = (Math.random() - 0.5) * shakeAmp; shakeY = (Math.random() - 0.5) * shakeAmp;
  popScore = Math.max(0, popScore - dt * 4);

  zp = Math.max(0, zp - dt * 2.2);
  tapRing = Math.max(0, tapRing - dt * 3);
  if ((state === 'PLAY' || state === 'DEMO') && block) {
    var speed = state === 'DEMO' ? 4.6 : 2.9 + drops * 0.06;
    block.pos += block.dir * speed * dt;
    if (block.pos > block.pivot + RANGE) { block.pos = 2 * (block.pivot + RANGE) - block.pos; block.dir = -1; }
    if (block.pos < block.pivot - RANGE) { block.pos = 2 * (block.pivot - RANGE) - block.pos; block.dir = 1; }
    if (state === 'PLAY') {
      if (blastEndT > 0) { blastEndT += dt; if (blastEndT > 2.0) endGame(); }
      if (drops >= 20 || time > 55) { if (blastEndT === 0) blastEndT = 0.01; }
    }
  }
  if (state === 'FAIL') {
    failT += dt;
    if (failT > 1.2) {
      if (attempt === 1) { attempt = 2; init(true, false); hintOn = true; banner('ONE MORE TRY', '', [140, 255, 225], 1.2); }
      else endGame();
    }
  }
  if (state === 'DEMO') demoStep(dt);
  if (state === 'END') endT += dt;

  for (var i = debris.length - 1; i >= 0; i--) {
    var d = debris[i]; d.life += dt; d.vy -= 9.5 * dt;
    d.cx += d.vx * dt; d.cz += d.vz * dt; d.y += d.vy * dt;
    if (d.life > 1.8) debris.splice(i, 1);
  }
  for (var j = parts.length - 1; j >= 0; j--) {
    var p = parts[j]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.coin ? 300 : 900) * dt; p.vx *= 0.985;
    if (p.life > p.max) parts.splice(j, 1);

  for (var w = waves.length - 1; w >= 0; w--) { waves[w].t += dt; if (waves[w].t > waves[w].dur) waves.splice(w, 1); }
  for (var b = banners.length - 1; b >= 0; b--) { banners[b].t += dt; if (banners[b].t > banners[b].dur) banners.splice(b, 1); }
}

/* ---------- drawing -------------------------------------------------------------------- */

}

  var bot = [lerp(a[1][0], b[1][0], t), lerp(a[1][1], b[1][1], t), lerp(a[1][2], b[1][2], t)];

    text('TAP TO SKIP', W / 2, H * 0.12 + Math.min(W * 0.075, 34), Math.min(W * 0.038, 16), 'rgba(255,255,255,0.7)', 'rgba(0,0,0,0)');

  text(CFG.TAGLINE, W / 2, H * 0.2 + isz / 2 + ts * 2.0, Math.min(W * 0.045, 20), 'rgba(190,240,225,0.95)', 'rgba(0,0,0,0)');
  text('BLASTS GET BIGGER', W / 2, H * 0.2 + isz / 2 + ts * 3.2, Math.min(W * 0.05, 22), '#ffffff');
  var ladder = [3, 5, 7, 9, 11], lx = W / 2, ly = H * 0.2 + isz / 2 + ts * 4.7, lw = Math.min(W * 0.14, 62);
  for (var li = 0; li < 5; li++) {
    var bxl = lx + (li - 2) * lw * 1.12, hgt = lw * (0.62 + li * 0.14), c = layerColor(li * 3 + 2);
    roundRect(bxl - lw * 0.42, ly - hgt / 2, lw * 0.84, hgt, 8, rgb(c, 1, 0.95));
    text(String(ladder[li]), bxl, ly, Math.min(lw * 0.5, 28), '#ffffff', 'rgba(10,8,26,0.7)');
  }
  text('CAN YOU REACH 11?', W / 2, ly + lw * 1.15, Math.min(W * 0.055, 24), '#ffe8a0');
  g.restore();

  var ca = easeOutBack((endT - 0.7) / 0.5), pulse = 1 + 0.045 * Math.sin(Math.max(0, endT - 1.1) * 5);
  var bw = Math.min(W * 0.78, 360), bh = Math.min(W * 0.17, 76), by = H * 0.85;
  g.save(); g.translate(W / 2, by); g.scale(Math.max(0.01, ca) * pulse, Math.max(0.01, ca) * pulse);
  g.shadowColor = 'rgba(92,232,196,0.55)'; g.shadowBlur = 28;
  roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2, '#5ce8c4'); g.shadowColor = 'transparent';
  text(CFG.CTA, 0, 2, bh * 0.44, '#0a0d18', 'rgba(255,255,255,0)'); g.restore();
  g.save(); g.globalAlpha = clamp((endT - 1.0) / 0.4, 0, 1);
  text('on the App Store', W / 2, by + bh / 2 + 34, Math.min(W * 0.04, 17), 'rgba(230,230,245,0.9)', 'rgba(0,0,0,0)'); g.restore();
}

/* ---------- loop ----------------------------------------------------------------------- */
var last = 0, running = false;
function frame(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function start() {
  if (running) return; running = true;
  init(false, true); requestAnimationFrame(function (ts) { last = ts; frame(ts); });
}
if (window.mraid && mraid.getState && mraid.getState() === 'loading') mraid.addEventListener('ready', start);
else start();

/* test hook, harmless in production */
window.__pg = {
  info: function () { return { state: state, drops: drops, score: score, blasts: blasts, streak: streak,
    delta: block ? block.pos - block.pivot : null, layers: stack.length }; },
  drop: function () { drop(); }, end: function () { endGame(); }, play: function () { startPlay(); }
};
})();
</script>
