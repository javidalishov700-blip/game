workflows:
  slice-blast-ios:
    name: Slice & Blast — iOS (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Codemagic UI → Teams/App settings → Integrations → App Store Connect.
    # Replace the key name below with the one you created there.
    integrations:
      app_store_connect: SliceBlast ASC Key

    environment:
      groups:
        # Codemagic UI → Environment variables. Group "unity" must contain:
        #   UNITY_EMAIL, UNITY_PASSWORD   (Unity account — Personal licences)
        #   UNITY_SERIAL                  (Plus/Pro only)
        #   UNITY_HOME                    (optional; the editor is located automatically)
        - unity
      vars:
        # UNITY_BIN is resolved at runtime by ci/find-unity.sh — group variables
        # are not expanded inside this block.
        UNITY_PROJECT: unity/SliceBlast
        UNITY_VERSION: 6000.3.22f1
        UNITY_MODULES: ios
        XCODE_PROJECT: unity/SliceBlast/ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.javidalishov.sliceblast
        APP_VERSION: 1.0.0
        IOS_MIN_VERSION: "13.0"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/slice-blast-core-sihw5b
          include: true
          source: true

    scripts:
      - name: Install the Unity editor
        script: bash ci/install-unity.sh

      - name: Activate Unity licence
        script: |
          UNITY_BIN="$(bash ci/find-unity.sh)" || exit 1
          echo "Unity: $UNITY_BIN"
          echo "UNITY_BIN=$UNITY_BIN" >> "$CM_ENV"

          # Plus/Pro -> UNITY_SERIAL. Personal -> UNITY_EMAIL + UNITY_PASSWORD (Unity
          # discontinued manual .ulf activation for Personal; UNITY_LICENSE is legacy only).
          if [ -n "${UNITY_SERIAL:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "${UNITY_EMAIL:-}" -password "${UNITY_PASSWORD:-}"
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          elif [ -n "${UNITY_LICENSE:-}" ]; then
            printf '%s' "$UNITY_LICENSE" > /tmp/unity.ulf
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -manualLicenseFile /tmp/unity.ulf || true
          else
            echo "No Unity licence configured: set UNITY_SERIAL (Plus/Pro), or UNITY_EMAIL + UNITY_PASSWORD (Personal)."
            exit 1
          fi

      - name: Generate the Xcode project with Unity
        script: |
          UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}"
          "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
            -projectPath "$UNITY_PROJECT" \
            -buildTarget iOS \
            -executeMethod SliceBlast.EditorTools.SliceBlastBuild.BuildIos

      # The declarative ios_signing block only *fetches* signing files; --create also
      # provisions the certificate and App Store profile the first time round.
      - name: Fetch (and create) signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Set the build number
        script: |
          cd unity/SliceBlast/ios
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      scripts:
        - name: Return the Unity licence
          script: |
            UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}" || exit 0
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -returnlicense || true

  slice-blast-android:
    name: Slice & Blast — Android APK
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - unity
      vars:
        # UNITY_BIN is resolved at runtime by ci/find-unity.sh — group variables
        # are not expanded inside this block.
        UNITY_PROJECT: unity/SliceBlast
        UNITY_VERSION: 6000.3.22f1
        UNITY_MODULES: android android-sdk-ndk-tools android-open-jdk
        BUNDLE_ID: com.javidalishov.sliceblast
        APP_VERSION: 1.0.0

    scripts:
      - name: Install the Unity editor
        script: bash ci/install-unity.sh

      - name: Activate Unity licence
        script: |
          UNITY_BIN="$(bash ci/find-unity.sh)" || exit 1
          echo "Unity: $UNITY_BIN"
          echo "UNITY_BIN=$UNITY_BIN" >> "$CM_ENV"

          # Plus/Pro -> UNITY_SERIAL. Personal -> UNITY_EMAIL + UNITY_PASSWORD (Unity
          # discontinued manual .ulf activation for Personal; UNITY_LICENSE is legacy only).
          if [ -n "${UNITY_SERIAL:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "${UNITY_EMAIL:-}" -password "${UNITY_PASSWORD:-}"
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          elif [ -n "${UNITY_LICENSE:-}" ]; then
            printf '%s' "$UNITY_LICENSE" > /tmp/unity.ulf
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -manualLicenseFile /tmp/unity.ulf || true
          else
            echo "No Unity licence configured: set UNITY_SERIAL (Plus/Pro), or UNITY_EMAIL + UNITY_PASSWORD (Personal)."
            exit 1
          fi

      - name: Build the APK
        script: |
          UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}"
          "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
            -projectPath "$UNITY_PROJECT" \
            -buildTarget Android \
            -executeMethod SliceBlast.EditorTools.SliceBlastBuild.BuildAndroid

    artifacts:
      - unity/SliceBlast/build/android/*.apk

    publishing:
      scripts:
        - name: Return the Unity licence
          script: |
            UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}" || exit 0
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -returnlicense || true

  # Takes an .ipa built elsewhere (Unity Build Automation) and ships it to TestFlight.
  # Windows cannot upload to App Store Connect — Apple only ships Transporter for macOS —
  # so this workflow exists purely to be that macOS uploader.
  deliver-ipa:
    name: Slice & Blast — Deliver IPA to TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SliceBlast ASC Key

    environment:
      groups:
        # Codemagic UI → Environment variables, group "delivery":
        #   IPA_URL  the direct download link of the Unity Build Automation artifact
        - delivery

    scripts:
      - name: Download the build
        script: |
          if [ -z "${IPA_URL:-}" ]; then
            echo "IPA_URL is not set. Copy the Download link from the Unity build page."
            exit 1
          fi

          curl -fL --retry 3 "$IPA_URL" -o payload.bin
          ls -lh payload.bin

          # Unity hands back either the .ipa itself or a zip containing it.
          if unzip -l payload.bin | grep -q "Payload/"; then
            mv payload.bin app.ipa
          else
            unzip -o payload.bin -d extracted
            FOUND="$(find extracted -name '*.ipa' | head -1)"
            if [ -z "$FOUND" ]; then
              echo "No .ipa found in the downloaded archive:"
              find extracted -maxdepth 3 | head -40
              exit 1
            fi
            mv "$FOUND" app.ipa
          fi

          ls -lh app.ipa

      - name: Upload to App Store Connect
        script: app-store-connect publish --path app.ipa

    artifacts:
      - app.ipa
