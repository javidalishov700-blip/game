workflows:
  slice-blast-ios:
    name: Slice & Blast — iOS (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Codemagic UI → Teams/App settings → Integrations → App Store Connect.
    # Replace the key name below with the one you created there.
    integrations:
      app_store_connect: SliceBlast ASC Key

    environment:
      groups:
        # Codemagic UI → Environment variables. Group "unity" must contain:
        #   UNITY_EMAIL, UNITY_PASSWORD   (Unity account — Personal licences)
        #   UNITY_SERIAL                  (Plus/Pro only)
        #   UNITY_HOME                    (optional; the editor is located automatically)
        - unity
      vars:
        # UNITY_BIN is resolved at runtime by ci/find-unity.sh — group variables
        # are not expanded inside this block.
        UNITY_PROJECT: unity/SliceBlast
        UNITY_VERSION: 6000.3.22f1
        UNITY_MODULES: ios
        XCODE_PROJECT: unity/SliceBlast/ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.javidalishov.sliceblast
        APP_VERSION: 1.1.0
        IOS_MIN_VERSION: "13.0"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/slice-blast-core-sihw5b
          include: true
          source: true

    scripts:
      - name: Install the Unity editor
        script: bash ci/install-unity.sh

      - name: Activate Unity licence
        script: |
          UNITY_BIN="$(bash ci/find-unity.sh)" || exit 1
          echo "Unity: $UNITY_BIN"
          echo "UNITY_BIN=$UNITY_BIN" >> "$CM_ENV"

          # Plus/Pro -> UNITY_SERIAL. Personal -> UNITY_EMAIL + UNITY_PASSWORD (Unity
          # discontinued manual .ulf activation for Personal; UNITY_LICENSE is legacy only).
          if [ -n "${UNITY_SERIAL:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "${UNITY_EMAIL:-}" -password "${UNITY_PASSWORD:-}"
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          elif [ -n "${UNITY_LICENSE:-}" ]; then
            printf '%s' "$UNITY_LICENSE" > /tmp/unity.ulf
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -manualLicenseFile /tmp/unity.ulf || true
          else
            echo "No Unity licence configured: set UNITY_SERIAL (Plus/Pro), or UNITY_EMAIL + UNITY_PASSWORD (Personal)."
            exit 1
          fi

      - name: Generate the Xcode project with Unity
        script: |
          UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}"
          "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
            -projectPath "$UNITY_PROJECT" \
            -buildTarget iOS \
            -executeMethod SliceBlast.EditorTools.SliceBlastBuild.BuildIos

      # The declarative ios_signing block only *fetches* signing files; --create also
      # provisions the certificate and App Store profile the first time round.
      - name: Fetch (and create) signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Set the build number
        script: |
          cd unity/SliceBlast/ios
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # A build stuck in Apple's beta review queue blocks every later submission with a
        # 422 ("Another build is in review") until it clears on its own — this expires it
        # instead, so the newest build always gets submitted.
        expire_build_submitted_for_review: true
      scripts:
        - name: Return the Unity licence
          script: |
            UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}" || exit 0
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -returnlicense || true

  slice-blast-android:
    name: Slice & Blast — Android APK
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - unity
      vars:
        # UNITY_BIN is resolved at runtime by ci/find-unity.sh — group variables
        # are not expanded inside this block.
        UNITY_PROJECT: unity/SliceBlast
        UNITY_VERSION: 6000.3.22f1
        UNITY_MODULES: android android-sdk-ndk-tools android-open-jdk
        BUNDLE_ID: com.javidalishov.sliceblast
        APP_VERSION: 1.1.0

    scripts:
      - name: Install the Unity editor
        script: bash ci/install-unity.sh

      - name: Activate Unity licence
        script: |
          UNITY_BIN="$(bash ci/find-unity.sh)" || exit 1
          echo "Unity: $UNITY_BIN"
          echo "UNITY_BIN=$UNITY_BIN" >> "$CM_ENV"

          # Plus/Pro -> UNITY_SERIAL. Personal -> UNITY_EMAIL + UNITY_PASSWORD (Unity
          # discontinued manual .ulf activation for Personal; UNITY_LICENSE is legacy only).
          if [ -n "${UNITY_SERIAL:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "${UNITY_EMAIL:-}" -password "${UNITY_PASSWORD:-}"
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          elif [ -n "${UNITY_LICENSE:-}" ]; then
            printf '%s' "$UNITY_LICENSE" > /tmp/unity.ulf
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -manualLicenseFile /tmp/unity.ulf || true
          else
            echo "No Unity licence configured: set UNITY_SERIAL (Plus/Pro), or UNITY_EMAIL + UNITY_PASSWORD (Personal)."
            exit 1
          fi

      - name: Build the APK
        script: |
          UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}"
          "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
            -projectPath "$UNITY_PROJECT" \
            -buildTarget Android \
            -executeMethod SliceBlast.EditorTools.SliceBlastBuild.BuildAndroid

    artifacts:
      - unity/SliceBlast/build/android/*.apk

    publishing:
      scripts:
        - name: Return the Unity licence
          script: |
            UNITY_BIN="${UNITY_BIN:-$(bash ci/find-unity.sh)}" || exit 0
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - -returnlicense || true

  # The Mac half of the escape hatch: GitHub Actions generates the Xcode project with Unity
  # on a free Linux runner, this compiles, signs and ships it. No Unity on this machine, and
  # no dependency on Unity Build Automation having a spare builder.
  xcode-to-testflight:
    name: Slice & Blast — Xcode project → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SliceBlast ASC Key

    environment:
      groups:
        # Add to the "unity" group in the Codemagic UI:
        #   GITHUB_TOKEN — fine-grained PAT, Contents: read on the repository
        - unity
      vars:
        GITHUB_REPO: javidalishov700-blip/game
        RELEASE_TAG: ios-xcode-latest
        XCODE_DIR: ios-xcode
        XCODE_PROJECT: ios-xcode/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.javidalishov.sliceblast
      # Declarative signing: Codemagic installs the certificate and profile from the team's
      # code signing identities before the scripts run. A certificate downloaded from App
      # Store Connect carries only its public half — the private key has to come from the
      # .p12 uploaded to Codemagic, which is what this block uses.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.javidalishov.sliceblast
      xcode: latest

    scripts:
      - name: Fetch the Xcode project built by GitHub Actions
        script: bash ci/fetch-xcode-project.sh "$XCODE_DIR"

      - name: Apply provisioning profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Set the build number
        script: |
          # Minutes since 2024 — the same formula the Unity post-process uses, so the number
          # only ever climbs. Codemagic's own counter restarts per workflow and would push a
          # build number *below* an earlier upload, which TestFlight then never offers as an
          # update on the device.
          BUILD_NUMBER=$(( ( $(date -u +%s) - 1704067200 ) / 60 ))
          echo "CFBundleVersion = $BUILD_NUMBER"
          cd "$XCODE_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Install CocoaPods dependencies (if the project needs them)
        script: |
          # A no-op today. The moment a native SDK gets pulled in through Unity's External
          # Dependency Manager (Google Mobile Ads, for one), it drops a Podfile into the
          # generated Xcode project, and without this step the build would link fine but
          # crash on launch for want of the actual native framework.
          if [ -f "$XCODE_DIR/Podfile" ]; then
            cd "$XCODE_DIR"
            pod install --repo-update
          fi

      - name: Build the .ipa
        script: |
          # CocoaPods, once it runs, replaces the project with a workspace that also loads
          # the Pods target — building the bare .xcodeproj after that would silently drop
          # every pod.
          if [ -f "$XCODE_DIR/Unity-iPhone.xcworkspace/contents.xcworkspacedata" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_DIR/Unity-iPhone.xcworkspace" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # A build stuck in Apple's beta review queue blocks every later submission with a
        # 422 ("Another build is in review") until it clears on its own — this expires it
        # instead, so the newest build always gets submitted.
        expire_build_submitted_for_review: true

  # Takes the .ipa built by Unity Build Automation and ships it to TestFlight.
  # Windows cannot upload to App Store Connect — Apple only ships Transporter for macOS —
  # so this workflow exists purely to be that macOS uploader.
  deliver-ipa:
    name: Slice & Blast — Deliver IPA to TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SliceBlast ASC Key

    environment:
      groups:
        # UNITY_CLOUD_API_KEY — Unity Cloud → Build Automation → Settings → API key.
        # IPA_URL is only a fallback; dashboard links are session-bound and answer 401.
        - unity
      vars:
        UNITY_ORG_ID: "18968486060677"
        UNITY_PROJECT_ID: 4a045a93-7509-4979-a15c-4d6723f95dea
        UNITY_BUILD_TARGET: ios-testflight

    scripts:
      - name: Fetch the Unity build
        script: bash ci/fetch-unity-ipa.sh app.ipa

      - name: Upload to App Store Connect
        script: app-store-connect publish --path app.ipa

    artifacts:
      - app.ipa
