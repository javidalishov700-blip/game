# Builds the iOS Xcode project with Unity on a free Linux runner, so shipping never
# depends on Unity Build Automation having a spare macOS builder.
#
# Unity is only needed to *generate* the Xcode project — that works on Linux. Compiling
# and signing it needs a Mac, and that half runs on Codemagic (workflow: xcode-to-testflight)
# where the signing certificate and the App Store Connect key are already configured.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   UNITY_EMAIL     the Unity account e-mail
#   UNITY_PASSWORD  its password
#   UNITY_LICENSE   contents of a .ulf licence file — required for a Personal licence.
#                   Unity Hub → Preferences → Licenses → Add → Get a free personal license
#                   writes it to C:\ProgramData\Unity\Unity_lic.ulf (a hidden folder); a
#                   licence that merely shows up in the Hub may never have produced the file.
name: iOS Xcode project

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Unity version (must have a GameCI image published)"
        required: false
        default: "6000.3.22f1"
      testAds:
        description: "TestFlight-only build: include the hidden test-ads switch (never for the App Store)"
        type: boolean
        required: false
        default: false

jobs:
  xcode-project:
    name: Unity → Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The last step publishes a release. Repositories created since 2023 hand workflows a
    # read-only token by default, which would let the whole Unity build run for half an hour
    # and then fail with a 403 on the one step that makes it useful.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Report which credentials are present
        run: |
          # Never print the values — just whether the job has them, so a licence failure
          # is one glance to diagnose instead of a guess.
          echo "UNITY_EMAIL set:    ${{ secrets.UNITY_EMAIL != '' }}"
          echo "UNITY_PASSWORD set: ${{ secrets.UNITY_PASSWORD != '' }}"
          echo "UNITY_LICENSE set:  ${{ secrets.UNITY_LICENSE != '' }}"

      # The editor install is the slow part; keeping the Library folder warm takes the
      # second build down to a few minutes.
      - uses: actions/cache@v4
        with:
          path: unity/SliceBlast/Library
          key: unity-library-ios-${{ hashFiles('unity/SliceBlast/Assets/**') }}
          restore-keys: unity-library-ios-

      - name: Check that a Unity image exists for this version
        run: |
          set -eu
          VERSION="${{ inputs.unityVersion }}"
          echo "Looking for unityci/editor tags matching $VERSION"
          # A missing image is the one failure that looks cryptic in the builder's log, so
          # find out here and print what is actually published instead.
          TAGS="$(curl -fsS "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=$VERSION" \
            | python3 -c 'import json,sys; print("\n".join(t["name"] for t in json.load(sys.stdin).get("results", [])))')"

          if [ -z "$TAGS" ]; then
            echo "::error::No GameCI image published for Unity $VERSION."
            echo "Recent 6000.x images with iOS support:"
            curl -fsS "https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=6000" \
              | python3 -c 'import json,sys; print("\n".join(sorted(t["name"] for t in json.load(sys.stdin).get("results", []) if "ios" in t["name"])))'
            echo "Re-run this workflow and put one of those editor versions in the unityVersion input."
            exit 1
          fi

          echo "$TAGS"

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/SliceBlast
          unityVersion: ${{ inputs.unityVersion }}
          targetPlatform: iOS
          allowDirtyBuild: true
          # Our own entry point, not GameCI's default build. ProjectSettings.asset is not in
          # the repository, so a fresh runner starts with no scripting defines at all, and
          # SLICEBLAST_ADS_ENABLED / SLICEBLAST_ATT_ENABLED are only set by ApplyPlayerSettings.
          # Under the default build that would happen inside the build's own preprocess step,
          # and whether that lands before or after the player scripts compile is pipeline
          # ordering this project has never verified. This method sets them before
          # BuildPipeline.BuildPlayer is even called — the path every successful TestFlight
          # build has taken. Getting it wrong ships ads and the App Tracking Transparency
          # prompt silently stubbed out, which is exactly what got 1.1 rejected.
          buildMethod: SliceBlast.EditorTools.SliceBlastBuild.BuildIos
          customParameters: ${{ inputs.testAds && '-sliceblastTestAds 1' || '-sliceblastTestAds 0' }}

      - name: Package the Xcode project
        run: |
          set -eu
          cd build/iOS
          # unity-builder writes the generated project into a folder named after the target.
          zip -qr "$GITHUB_WORKSPACE/ios-xcode.zip" iOS
          ls -la "$GITHUB_WORKSPACE/ios-xcode.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode
          path: ios-xcode.zip
          retention-days: 7

      # A release asset is what the Mac side can fetch without credentials. Each build gets
      # its own tag: re-creating a just-deleted tag (the old rolling "ios-xcode-latest")
      # started failing with HTTP 403. ci/fetch-xcode-project.sh picks the newest one.
      - name: Publish as an ios-xcode release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="ios-xcode-${{ github.run_id }}${{ inputs.testAds && '-testads' || '' }}"
          for attempt in 1 2 3; do
            if gh release create "$TAG" ios-xcode.zip \
                --title "iOS Xcode project ${{ github.run_id }}${{ inputs.testAds && ' - TEST ADS, TestFlight only' || '' }}" \
                --notes "Generated from ${{ github.sha }} by the iOS Xcode project workflow. Test ads: ${{ inputs.testAds && 'YES (TestFlight testing only, do not submit)' || 'no (App Store ready)' }}." \
                --target "${{ github.sha }}"; then
              echo "published $TAG"
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
